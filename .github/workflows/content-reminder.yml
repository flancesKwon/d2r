# 매주 월요일, 손으로 고치는 정보(래더·패치노트·시세 티어)가 오래됐으면 이슈를 하나 열어 알림
# 이미 열린 알림 이슈가 있으면 새로 안 만듦. 정보 갱신 후 contentMeta.json 날짜를 바꾸고 이슈를 닫으면 됨
name: 정보 갱신 알림

on:
  schedule:
    - cron: '7 0 * * 1' # 월요일 09:07 (한국)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 날짜 확인
        id: age
        run: |
          out=$(node scripts/check-content-age.js || true)
          echo "$out"
          if echo "$out" | grep -q '::warning::'; then
            { echo 'body<<EOF'; echo "$out" | sed -n 's/^::warning:://p' | sed 's/^/- /'; echo 'EOF'; } >> "$GITHUB_OUTPUT"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 이슈 열기
        if: steps.age.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.age.outputs.body }}
        run: |
          title="정보 갱신 필요 (래더·패치노트·시세)"
          if gh issue list --state open --search "$title in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "이미 열린 알림 이슈 있음"; exit 0
          fi
          gh issue create --title "$title" --body "$(printf '%s\n\n갱신하면 src/data/contentMeta.json 의 날짜도 바꾸고 이 이슈를 닫아주세요.' "$BODY")"
